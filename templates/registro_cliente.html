<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Librería Salesiana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
        }
        .register-card {
            border-radius: 20px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div class="card register-card shadow-lg">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <i class="fas fa-user-plus fa-2x mb-2"></i>
                        <h4 class="mb-0">Registro de Cliente</h4>
                        <small>Crea tu cuenta para comprar online</small>
                    </div>
                    <div class="card-body p-4">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}
                        
                        <form method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Nombres *</label>
                                    <input type="text" name="nombres" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Apellidos *</label>
                                    <input type="text" name="apellidos" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">DNI (opcional)</label>
                                <input type="text" name="dni" class="form-control" maxlength="8" placeholder="12345678">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo Electrónico *</label>
                                <input type="email" name="email" class="form-control" placeholder="cliente@email.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Teléfono</label>
                                <input type="tel" name="telefono" class="form-control" placeholder="987654321">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Dirección</label>
                                <textarea name="direccion" class="form-control" rows="2" placeholder="Calle, número, referencia..."></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Contraseña *</label>
                                <input type="password" name="clave" class="form-control" required minlength="6">
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Confirmar Contraseña *</label>
                                <input type="password" id="confirmar_clave" class="form-control" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                <i class="fas fa-check-circle"></i> Registrarme
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center bg-light">
                        <small>¿Ya tienes cuenta? <a href="/login-cliente">Inicia sesión aquí</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            let clave = document.querySelector('input[name="clave"]').value;
            let confirmar = document.getElementById('confirmar_clave').value;
            if (clave !== confirmar) {
                e.preventDefault();
                alert('❌ Las contraseñas no coinciden');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

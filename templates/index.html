{% extends 'base.html' %}
{% block titulito %}📚 Cargando Librería Salesiana...{% endblock %}
{% block contenido %}
<!--- PANTALLA DE CARGA COMPLETA -->
<div id="loadingScreen" class="loading-screen-full d-flex align-items-center justify-content-center min-vh-100 p-3">
    <!-- FONDO ANIMADO -->
    <div class="loading-bg"></div>

    <!-- CONTENEDOR CENTRAL -->
    <div class="loading-content text-center position-relative">
        <!-- LOGO SALESIANO -->
        <div class="logo-wrapper mb-5">
            <div class="logo-ring mb-4">
                <i class="fas fa-book-open"></i>
            </div>
            <h1 class="logo-title mb-2">Salesiana</h1>
            <p class="logo-subtitle">Librería Don Bosco</p>
        </div>

        <!-- BARRA DE PROGRESO SIMPLE -->
        <div class="progress-section mb-4">
            <div class="progress-label mb-3">
                <span class="progress-text">Inicializando sistema...</span>
            </div>
            <div class="progress-bar-wrapper">
                <div class="progress-bar-bg">
                    <div class="progress-fill-gold" id="progressFill"></div>
                </div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>

        <!-- PUNTOS ANIMADOS -->
        <div class="dots-container">
            <div class="loading-dot"></div>
            <div class="loading-dot dot-delay-1"></div>
            <div class="loading-dot dot-delay-2"></div>
        </div>

        <!-- CONTADOR -->
        <div class="countdown-section mt-4">
            <span class="countdown-number" id="countdownNum">3</span>
            <span class="countdown-label">s</span>
        </div>
    </div>
</div>

<style>
    /* ESTILOS SIMPLIFICADOS - FUNCIONAN SIEMPRE */
    .loading-screen-full {
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #f59e0b 100%);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
    }

    /* LOGO */
    .logo-wrapper {
        animation: fadeInUp 0.8s ease-out;
    }

    .logo-ring {
        width: 120px;
        height: 120px;
        border: 3px solid rgba(212, 175, 55, 0.4);
        border-radius: 50%;
        margin: 0 auto;
        position: relative;
        animation: spinSlow 4s linear infinite;
    }

    .logo-ring i {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 3rem;
        color: #d4af37;
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
    }

    .logo-title {
        color: white;
        font-size: 2.5rem;
        font-weight: 800;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        margin: 0;
        animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .logo-subtitle {
        color: #fbbf24;
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0;
        animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    /* PROGRESO */
    .progress-section {
        max-width: 350px;
        margin: 0 auto;
        animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    .progress-label {
        color: white;
        font-weight: 500;
        font-size: 1.1rem;
    }

    .progress-bar-wrapper {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 25px;
        height: 12px;
        overflow: hidden;
        margin: 1rem 0;
    }

    .progress-bar-bg {
        height: 100%;
        border-radius: 25px;
        overflow: hidden;
    }

    .progress-fill-gold {
        height: 100%;
        background: linear-gradient(90deg, #d4af37, #fbbf24);
        width: 0%;
        border-radius: 25px;
        transition: width 0.4s ease;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
    }

    .progress-percent {
        color: #fbbf24;
        font-weight: 700;
        font-size: 1.3rem;
    }

    /* PUNTOS */
    .dots-container {
        animation: fadeInUp 0.8s ease-out 0.8s both;
    }

    .loading-dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        background: #fbbf24;
        border-radius: 50%;
        margin: 0 6px;
        animation: bounceDot 1.4s infinite ease-in-out;
    }

    .dot-delay-1 {
        animation-delay: 0.2s;
    }

    .dot-delay-2 {
        animation-delay: 0.4s;
    }

    @keyframes bounceDot {

        0%,
        80%,
        100% {
            transform: scale(0.8);
            opacity: 0.5;
        }

        40% {
            transform: scale(1.2);
            opacity: 1;
        }
    }

    /* CONTADOR */
    .countdown-section {
        animation: fadeInUp 0.8s ease-out 1s both;
    }

    .countdown-number {
        display: inline-block;
        font-size: 3rem;
        font-weight: 900;
        color: #fbbf24;
        min-width: 60px;
        text-shadow: 0 0 15px rgba(251, 191, 36, 0.8);
        animation: pulseCount 1s ease-in-out infinite alternate;
    }

    @keyframes pulseCount {
        0% {
            transform: scale(1);
        }

        100% {
            transform: scale(1.1);
        }
    }

    .countdown-label {
        color: white;
        font-size: 1.2rem;
        font-weight: 500;
        margin-left: 0.5rem;
    }

    /* ANIMACIONES */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes spinSlow {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    /* RESPONSIVE */
    @media (max-width: 576px) {
        .logo-title {
            font-size: 2rem;
        }

        .countdown-number {
            font-size: 2.5rem;
        }

        .logo-ring {
            width: 100px;
            height: 100px;
        }

        .logo-ring i {
            font-size: 2.5rem;
        }
    }
</style>

<script>
    // CARGA AUTOMÁTICA - SIMPLE Y FUNCIONAL
    document.addEventListener('DOMContentLoaded', function () {
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressText = document.querySelector('.progress-text');
        const countdownNum = document.getElementById('countdownNum');

        if (!progressFill || !progressPercent || !progressText || !countdownNum) return;

        let progress = 0;
        let countdown = 3;
        let phase = 0;

        const phases = [
            'Cargando módulos...',
            'Conectando base de datos...',
            'Inicializando ventas...',
            '¡Listo! 🙏'
        ];

        // PROGRESO
        const progressTimer = setInterval(() => {
            progress += 2 + Math.random() * 3;
            if (progress > 100) progress = 100;

            progressFill.style.width = progress + '%';
            progressPercent.textContent = Math.floor(progress) + '%';

            if (progress >= 25 * (phase + 1) && phase < 3) {
                phase++;
                progressText.textContent = phases[phase];
            }

            if (progress >= 100) {
                clearInterval(progressTimer);
            }
        }, 120);

        // CONTADOR Y REDIRECCIÓN
        const countdownTimer = setInterval(() => {
            countdown--;
            countdownNum.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(countdownTimer);
                window.location.href = '/catalogo';
            }
        }, 1000);
    });
</script>
{% endblock %}

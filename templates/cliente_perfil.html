{% extends 'base_cliente.html' %}
{% block titulito %}Mi Perfil - Cliente{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="fas fa-user-circle me-2"></i> Mi Perfil
                </h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('cliente_actualizar_perfil') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombres</label>
                            <input type="text" name="nombres" class="form-control" value="{{ cliente.nombres }}"
                                required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text" name="apellidos" class="form-control" value="{{ cliente.apellidos }}"
                                required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" value="{{ cliente.email }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">DNI</label>
                            <input type="text" name="dni" class="form-control" value="{{ cliente.dni or '' }}"
                                maxlength="8">
                            <small class="text-muted">Opcional, máximo 8 dígitos</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control"
                                value="{{ cliente.telefono or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <textarea name="direccion" class="form-control"
                            rows="3">{{ cliente.direccion or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('catalogo_cliente') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mt-3 shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <i class="fas fa-key text-warning me-2"></i>
                        <strong>Seguridad:</strong> Cambia tu contraseña regularmente
                    </div>
                    <a href="{{ url_for('cliente_cambiar_contrasena') }}" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-key me-1"></i> Cambiar Contraseña
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
